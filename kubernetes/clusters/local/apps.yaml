apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps
  namespace: flux-system
spec:
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: registry
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: apps
    - kind: ServiceAccount
      apiVersion: v1
      metadata:
        name: dev-team
        namespace: apps
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: dev-team-reconciler
        namespace: apps
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
        - kind: ServiceAccount
          name: dev-team
          namespace: apps
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: apps-source
        namespace: << inputs.provider.namespace >>
      spec:
        interval: 1m
        insecure: << inputs.insecure >>
        url: "oci://<< inputs.repository >>/flux-apps-sync"
        ref:
          tag: << inputs.tag | quote >>
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: apps-sync
        namespace: << inputs.provider.namespace >>
      spec:
        dependsOn:
          - name: infra-sync
        interval: 1h
        retryInterval: 1m
        timeout: 5m
        path: ./
        prune: true
        wait: true
        sourceRef:
          kind: OCIRepository
          name: apps-source
